<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5c518">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-nav" id="top">
      <div class="nav-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="NYC Budget Allocation Findings home">
          <span class="brand-mark" aria-hidden="true">NYC</span>
          <span>Budget Allocation <strong>Findings</strong></span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-menu">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-links" id="site-menu" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#home">Home</a>
          <a href="{{ '/' | relative_url }}#dot">DOT</a>
          <a href="{{ '/' | relative_url }}#parks">Parks</a>
          <a href="{{ '/' | relative_url }}#education">Education</a>
          <a href="{{ '/' | relative_url }}#methodology">Methodology</a>
          <a href="{{ '/' | relative_url }}#recommendations">Recommendations</a>
        </nav>
      </div>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <div><div class="footer-title">NYC Budget Allocation Findings</div><p>Data-driven analysis of NYC agency spending and forecasting.</p></div>
        <div class="footer-meta">
          <a href="{{ site.github_repository_url }}" target="_blank" rel="noopener">GitHub repository ↗</a>
          <span>Built with Python, Scikit-learn, Jekyll, GitHub Pages &amp; Tableau</span>
        </div>
      </div>
    </footer>
    <script>
      const toggle = document.querySelector('.nav-toggle');
      const menu = document.querySelector('.nav-links');
      if (toggle && menu) {
        toggle.addEventListener('click', () => {
          const open = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!open));
          menu.classList.toggle('is-open');
        });
        menu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
          toggle.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open');
        }));
      }
    </script>
  </body>
</html>
